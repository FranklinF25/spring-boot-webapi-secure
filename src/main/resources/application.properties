spring.application.name=springboot-devsecops-lab

spring.datasource.url=jdbc:h2:mem:devsecopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always

# LAB: configuracion deliberadamente insegura.
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
server.error.include-message=always
server.error.include-stacktrace=always

# Credencial ficticia. Nunca utilizar valores reales en este repositorio.
lab.external.api-key=LAB-DEMO-KEY-7f91c2a4-insecure

# Lab credentials, overridable through environment variables.
lab.auth.username=${LAB_AUTH_USERNAME:devstudent}
lab.auth.password=${LAB_AUTH_PASSWORD:Devstudent123!}
lab.auth.token=${LAB_AUTH_TOKEN:devsecops-lab-secret-key-123456789}

# HTTP Basic account for Spring Security (same lab credentials).
spring.security.user.name=${lab.auth.username}
spring.security.user.password=${lab.auth.password}
