name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    # 'timezone' is not supported here: GitHub cron always runs in UTC.
    - cron: '55 20 * * *'  # 20:55 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Needed for Sonar / CodeQL history

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
              -DskipITs=false \
              org.jacoco:jacoco-maven-plugin:prepare-agent \
              org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ------------------------------------------------------------------
  # 3. Static Application Security Testing (SAST) - Semgrep
  # ------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Software Composition Analysis (SCA) - Dependency vulnerabilities
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Rolling key: Actions caches are immutable, so a new key per run
      # stores a fresh copy of the NVD database while restore-keys reuse
      # the most recent one from previous runs.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-db-v1-${{ github.run_number }}
          restore-keys: |
            nvd-db-v1-

      - name: Run OWASP Dependency-Check
        run: |
          mvn -B org.owasp:dependency-check-maven:11.1.1:check \
              -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
              -DfailBuildOnCVSS=11 \
              -DsuppressionFile=dependency-check-suppressions.xml \
              -Dformat='HTML,JSON'

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 5. Optional: SpotBugs + PMD (static analysis)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs & PMD
        # Report-only goals: scanners produce the XML, the quality gate decides.
        run: |
          mvn -B clean compile \
              com.github.spotbugs:spotbugs-maven-plugin:spotbugs \
              org.apache.maven.plugins:maven-pmd-plugin:pmd

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 6. Quality Gate (fails the workflow on critical findings)
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep, sast-codeql, static-analysis, sca-dependency-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail if build failed
        if: needs.build-and-test.result != 'success'
        run: |
          echo "Build/test job failed"
          exit 1

      - name: Fail if SCA job failed
        if: needs.sca-dependency-check.result == 'failure'
        run: |
          echo "SCA (dependency-check) job failed: infrastructure error, NOT a clean scan"
          exit 1

      - name: Download Semgrep reports
        uses: actions/download-artifact@v4
        with:
          name: semgrep-reports

      - name: Download static analysis reports
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-reports

      - name: Download dependency-check report
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report

      - name: Quality gate - fail on critical findings
        run: python3 scripts/quality_gate.py --semgrep semgrep-reports/semgrep-results.json --spotbugs static-analysis-reports/spotbugsXml.xml --dependency-check dependency-check-report/dependency-check-report.json